# Builds the depth-camera package -- one zip per architecture, containing every
# camera backend that platform can carry -- ready to be listed in
# ossia/score-packages.
#
# What it does *not* do is build score. The backends share no code with the
# score plug-in: they talk to it through the pure-C depthcam_abi.h and are
# dlopen'd at runtime. So -DSCORE_DEPTHCAM_BACKENDS_ONLY=1 needs a C++ compiler
# and the vendored SDKs and nothing else -- no score checkout, no Qt, no ossia
# SDK. That is what makes it possible to publish a package for a platform
# without a working score build on it, and it takes minutes rather than hours.
#
# fail-fast is off on purpose: the SDKs do not all support all three platforms,
# so one going red must not cancel the others.

name: Package

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A superseded run is worth nothing and these jobs are slow enough that the
# queue matters: three platforms, three vendored SDKs each, and runners that
# regularly take longer to allocate than the build takes to run.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # `expect` is checked against the package afterwards. Every backend is
          # optional at configure time, so a missing system dependency otherwise
          # drops one silently and the build still passes.
          - name: "Linux (x86_64)"
            os: ubuntu-22.04
            arch: linux-x86_64
            expect: "orbbec freenect freenect2 k4a realsense oak depthai"
            flags: "-DSCORE_DEPTHCAM_FREENECT2_OPENCL=ON"

          - name: "macOS (arm64)"
            os: macos-15
            arch: darwin-aarch64
            # No Azure Kinect: Microsoft never released an SDK for macOS, so the
            # backend would build and then find nothing to load. No Oak either:
            # Oak3DVision only ever published an x86_64 macOS binary, and the
            # SDK is prebuilt, so there is nothing to recompile for arm64.
            # depthai *is* here: it is built from source, and arm64 macOS is in
            # Luxonis' own CI matrix.
            expect: "orbbec freenect freenect2 realsense depthai"
            flags: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DSCORE_DEPTHCAM_FREENECT2_OPENCL=ON"

          - name: "Linux (aarch64)"
            os: ubuntu-24.04-arm
            arch: linux-aarch64
            # No Azure Kinect: Microsoft's runtime is x86_64-only, so the
            # backend would build against the vendored headers and then have
            # nothing to dlopen. Oak is here: Oak3DVision did publish an aarch64
            # Linux build, and it is the one that needs no glfw or OpenCL.
            expect: "orbbec freenect freenect2 realsense oak depthai"
            flags: "-DSCORE_DEPTHCAM_BUILD_K4A=OFF -DSCORE_DEPTHCAM_FREENECT2_OPENCL=ON"

          - name: "macOS (x86_64)"
            os: macos-15-intel
            arch: darwin-x86_64
            expect: "orbbec freenect freenect2 realsense oak depthai"
            flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DSCORE_DEPTHCAM_FREENECT2_OPENCL=ON"

          - name: "Windows (x86_64)"
            os: windows-2022
            arch: windows-x86_64
            # No Oak: the only Windows binary Oak3DVision ever shipped is
            # 32-bit (pointcloud.dll and .lib are both machine 0x014c), so it
            # cannot be linked into an x64 module at all.
            expect: "orbbec freenect freenect2 k4a realsense depthai"
            # Stated rather than left to whatever the runner happens to have
            # installed. libfreenect2 links the OpenCL ICD loader outright, and
            # on Windows that is a file a GPU driver puts in System32 rather
            # than part of the OS -- a machine without one could not load the
            # Kinect v2 backend at all. The runner has no OpenCL SDK either way,
            # so this only makes the artefact reproducible. A Kinect v2 on
            # Windows therefore gets the CPU depth pipeline from this package;
            # build it yourself with =ON for the fast one.
            flags: "-DSCORE_DEPTHCAM_FREENECT2_OPENCL=OFF"

          - name: "Windows (arm64)"
            os: windows-11-arm
            arch: windows-aarch64
            # No Oak: Oak3DVision's only Windows binary is 32-bit x86.
            # depthai *is* built: it comes from source, and vcpkg has a stock
            # arm64-windows triplet. Luxonis does not test that combination, so
            # this row is the thing most likely to go red first -- which is what
            # `expect` exists for.
            expect: "orbbec freenect freenect2 realsense depthai"
            flags: "-DSCORE_DEPTHCAM_BUILD_K4A=OFF -DSCORE_DEPTHCAM_FREENECT2_OPENCL=OFF"
            msvc_arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libusb-1.0-0-dev libudev-dev libturbojpeg0-dev ocl-icd-opencl-dev

      # No libusb, and no libjpeg-turbo. Off Linux neither is a system library,
      # and Homebrew's leave an absolute path in the shipped binary that only
      # exists on the machine that built it. Both come from the copies the
      # OrbbecSDK vendors instead -- see the libusb section of
      # Backends/CMakeLists.txt.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ninja -y --no-progress

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.msvc_arch || 'x64' }}

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCORE_DEPTHCAM_BACKENDS_ONLY=1 \
            ${{ matrix.config.flags }}

      - name: Build the package
        shell: bash
        run: cmake --build build --target depthcam-package

      - name: Check the package
        shell: bash
        run: |
          Deployment/CheckPackage.sh \
            build/depth-camera-stage/depth-camera "${{ matrix.config.expect }}"

      # depthai-core is linked into its backend statically, with a dependency
      # closure resolved at build time: load the staged module and enumerate,
      # so a library missing from that link or from the package fails here
      # rather than on a user's machine. No camera on the runner; zero devices
      # is the expected answer.
      - name: Load the DepthAI backend
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   ext=dylib ;;
            Windows) ext=dll ;;
            *)       ext=so ;;
          esac
          cmake --build build --target depthcam-probe
          build/depthcam-probe "build/depth-camera-stage/depth-camera/score_depthcam_depthai.$ext"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: depth-camera-${{ matrix.config.arch }}
          path: build/depth-camera-${{ matrix.config.arch }}.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/depth-camera-${{ matrix.config.arch }}.zip
          tag: ${{ github.ref }}
          overwrite: true

  # The manifest the package manager reads. Written once, from the tag, so the
  # download URLs cannot drift from the assets the jobs above just uploaded.
  manifest:
    name: Manifest
    needs: package
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Generate depth-camera.json
        run: |
          python3 Deployment/make_manifest.py \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --out depth-camera.json
          cat depth-camera.json

      - name: Attach to the release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: depth-camera.json
          tag: ${{ github.ref }}
          overwrite: true
